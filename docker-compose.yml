version: "3.8"

services:
  kristo-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WALLET_ADDRESS=0xd4cdA980839C8FED4374EE37EA8DBE8c4ECfd88f
      - BASE_RPC_URL=https://mainnet.base.org
      - PRICE_USDC=0.25
      - RATE_LIMIT=30/minute
      - DB_PATH=/data/kristo.db
    volumes:
      - kristo-data:/data
    restart: unless-stopped

volumes:
  kristo-data:
